<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="emblem-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#134e3f"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#e07a2c"/>
    </linearGradient>
  </defs>
  <!-- Outer Sacred Geometry / Circle of Wellness & Career -->
  <circle cx="50" cy="50" r="46" stroke="#134e3f" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4"/>
  <circle cx="50" cy="50" r="42" stroke="url(#emblem-grad)" stroke-width="2" fill="#faf9f5"/>
  
  <!-- Subtle 8-point geometric rosette rays -->
  <g opacity="0.15" stroke="#134e3f" stroke-width="1">
    <line x1="50" y1="8" x2="50" y2="92"/>
    <line x1="8" y1="50" x2="92" y2="50"/>
    <line x1="20" y1="20" x2="80" y2="80"/>
    <line x1="80" y1="20" x2="20" y2="80"/>
  </g>

  <!-- Central Interconnected Leaf Matrix -->
  <!-- Ayurveda/Herbal Leaf -->
  <path d="M50 18 C38 30 36 50 50 72 C50 72 40 55 44 34 Z" fill="#134e3f"/>
  <path d="M50 18 C62 30 64 50 50 72 C50 72 60 55 56 34 Z" fill="#0d9488"/>
  <path d="M50 26 C47 35 47 48 50 58 C53 48 53 35 50 26 Z" fill="#e07a2c"/>

  <!-- Network Connection Nodes (Industry & Academia) -->
  <circle cx="32" cy="34" r="4" fill="#0d9488"/>
  <circle cx="68" cy="34" r="4" fill="#134e3f"/>
  <circle cx="50" cy="78" r="5" fill="#e07a2c"/>
  <circle cx="28" cy="58" r="3.5" fill="#134e3f"/>
  <circle cx="72" cy="58" r="3.5" fill="#0d9488"/>

  <!-- Connecting Edges -->
  <path d="M32 34 L50 26 L68 34" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M28 58 L50 78 L72 58" stroke="#e07a2c" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="72" x2="50" y2="78" stroke="#e07a2c" stroke-width="2"/>
</svg>
